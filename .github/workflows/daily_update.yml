name: Daily Article Update

on:
  schedule:
    # Runs at 23:00 UTC every day (07:00 AM Beijing Time)
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web

jobs:
  update-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest TechCrunch & Seeking Alpha articles
        run: |
          python update_articles.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: daily fresh TechCrunch & Seeking Alpha articles" && git push)
